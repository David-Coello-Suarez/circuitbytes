# Sitio estatico multipagina (Astro). Se monta en
# /etc/nginx/conf.d/default.conf y sustituye al default de la imagen
# nginx-unprivileged, que ya escucha en 8080 como UID 101.

server {
  listen       8080;
  server_name  _;

  root  /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Detras de un proxy inverso que termina TLS. Astro genera
  # privacidad/index.html, asi que /privacidad provoca un 301 a /privacidad/;
  # sin estas dos directivas nginx emitiria Location: http://host:8080/... ,
  # filtrando el puerto interno y degradando el HTTPS a HTTP.
  absolute_redirect off;
  port_in_redirect  off;

  charset utf-8;
  charset_types text/html text/css text/plain text/xml application/javascript
                application/json image/svg+xml;

  # Se sirven los .gz generados en el build; gzip en caliente solo como
  # respaldo para lo que no se precomprimio.
  gzip_static on;
  gzip        on;
  gzip_vary   on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml;

  # Limites: aqui no se sube nada, el cuerpo de las peticiones es innecesario.
  client_max_body_size 1m;
  client_body_timeout  10s;
  client_header_timeout 10s;

  # ---- Cabeceras de seguridad ----
  # add_header no se hereda en un location que declare sus propias cabeceras,
  # por eso se repiten mediante el include de abajo.
  include /etc/nginx/conf.d/security-headers.inc;

  # Healthcheck ligero: no toca disco ni deja rastro en el log.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Assets con hash en el nombre: cache larga e inmutable.
  # ^~ para que gane a los location regex de abajo (dentro de _astro/ todo
  # lleva hash, incluidas fuentes e imagenes).
  # Sin `expires`: emitiria su propia cabecera Cache-Control y acabariamos con
  # dos. Aqui la unica fuente de verdad es este add_header.
  location ^~ /_astro/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Imagenes e iconos de public/: no llevan hash, pueden cambiar sin cambiar de
  # nombre, asi que cache corta con revalidacion.
  location ~* \.(png|jpe?g|gif|webp|avif|svg|ico)$ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    try_files $uri =404;
  }

  # Fuentes self-hosted (@fontsource-variable): estables, cache larga.
  location ~* \.woff2?$ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # El HTML nunca se cachea: es lo que permite publicar una version nueva sin
  # que nadie quede clavado en la anterior.
  location ~* \.html$ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Archivos ocultos: fuera.
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  # try_files sin fallback a /index.html: esto es un sitio multipagina, no una
  # SPA. Un fallback enmascararia los 404 reales y perjudicaria el SEO.
  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}
